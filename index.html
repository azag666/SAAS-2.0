<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SaaS Cockpit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0d0c1d; --bg-medium: #19182c; --bg-light: #242240;
            --border-color: rgba(130, 87, 229, 0.2); --text-primary: #e0e0ff; --text-secondary: #a09fbe;
            --accent-purple: #8257e5; --accent-cyan: #00f2ea;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-medium); }
        ::-webkit-scrollbar-thumb { background: #3c4157; border-radius: 4px; }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            display: flex;
            font-size: 15px;
            background-image: linear-gradient(var(--border-color) 1px, transparent 1px), linear-gradient(to right, var(--border-color) 1px, var(--bg-dark) 1px);
            background-size: 25px 25px;
        }
        #sidebar {
            width: 250px; background-color: rgba(25, 24, 44, 0.8); backdrop-filter: blur(10px);
            padding: 2.5rem 1rem; height: 100vh; position: fixed;
            border-right: 1px solid var(--border-color); z-index: 10;
        }
        #sidebar h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 2.5rem; padding: 0 0.5rem; text-shadow: 0 0 10px var(--accent-purple); }
        .nav-link { display: flex; align-items: center; padding: 1rem; border-radius: 8px; color: var(--text-secondary); text-decoration: none; margin-bottom: 0.5rem; font-weight: 500; transition: all 0.2s; cursor: pointer; border-left: 3px solid transparent; }
        .nav-link i { width: 24px; text-align: center; margin-right: 1rem; font-size: 1.1rem; }
        .nav-link:hover { color: var(--text-primary); background-color: rgba(130, 87, 229, 0.1); }
        .nav-link.is-active { color: var(--accent-cyan); background-color: rgba(0, 242, 234, 0.1); border-left: 3px solid var(--accent-cyan); }
        
        #main-content { margin-left: 250px; width: calc(100% - 250px); padding: 2.5rem 3.5rem; animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .section-content { display: none; }
        .section-content.is-active { display: block; }
        .header-bar { margin-bottom: 2rem; }
        .header-bar h2 { font-size: 2.5rem; font-weight: 700; }

        .card {
            background: linear-gradient(145deg, rgba(36, 34, 64, 0.6), rgba(25, 24, 44, 0.6));
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-radius: 16px; border: 1px solid var(--border-color);
            padding: 1.5rem; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; }
        .kpi-card .heading { font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 0.5rem; font-weight: 500; }
        .kpi-card .value { font-size: 2.2rem; font-weight: 700; color: var(--text-primary); }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 1.25rem 1rem; text-align: left; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
        th { font-weight: 600; color: var(--text-secondary); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }
        tbody tr:hover { background-color: rgba(130, 87, 229, 0.05); }
        
        .tag { display: inline-block; padding: 0.3rem 0.6rem; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
        .tag.is-success { background-color: rgba(0, 242, 234, 0.1); color: var(--accent-cyan); border: 1px solid var(--accent-cyan); }
        .tag.is-danger { background-color: rgba(255, 77, 77, 0.1); color: #ff4d4d; border: 1px solid #ff4d4d; }
        
        .action-button { background: none; border: 1px solid var(--border-color); color: var(--text-secondary); cursor: pointer; width: 36px; height: 36px; border-radius: 8px; margin: 0 4px; transition: all 0.2s; }
        .action-button:hover { color: var(--accent-cyan); border-color: var(--accent-cyan); background-color: var(--bg-card); }
        .action-button.danger:hover { color: var(--danger); border-color: var(--danger); }
        
        .modal { display: none; align-items: center; justify-content: center; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); backdrop-filter: blur(5px); }
        .modal-content { background-color: var(--bg-medium); padding: 2rem; border: 1px solid var(--border-color); width: 80%; max-width: 500px; border-radius: 12px; position: relative; box-shadow: 0 0 30px rgba(130, 87, 229, 0.2); }
        .close-button { color: var(--text-secondary); position: absolute; top: 1rem; right: 1.5rem; font-size: 28px; font-weight: bold; cursor: pointer; }
        .form-label { display: block; margin-bottom: .5rem; font-weight: 500; color: var(--text-secondary); }
        .form-input { width: 100%; padding: .75rem; background-color: var(--bg-dark); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-primary); margin-bottom: 1rem; font-size: 1rem; }
        .form-input:focus { outline: none; border-color: var(--accent-purple); box-shadow: 0 0 10px var(--accent-purple-transparent); }
        .modal-button { width: 100%; padding: 0.8rem; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: all 0.2s; background: linear-gradient(90deg, var(--accent-purple), var(--accent-cyan)); color: white; }
        .modal-button:hover { box-shadow: 0 0 20px rgba(130, 87, 229, 0.5); }
        
        .level-badge { display: inline-flex; align-items: center; gap: 0.5rem; font-weight: 600; }
        .level-badge i { font-size: 1.2rem; }
        .level-bronze { color: #cd7f32; } .level-prata { color: #c0c0c0; }
        .level-ouro { color: #ffd700; } .level-platina { color: #e5e4e2; }
        .progress-bar { width: 100%; background-color: var(--bg-dark); border-radius: 4px; height: 5px; overflow: hidden; }
        .progress-bar-inner { height: 100%; background: linear-gradient(90deg, var(--accent-purple), var(--accent-cyan)); border-radius: 4px; }
    </style>
</head>
<body>
    <div id="commission-modal" class="modal"> <!-- Modal de Comissão --> </div>

    <nav id="sidebar">
        <h1>SaaS</h1>
        <a class="nav-link is-active" data-tab="dashboard"><i class="fas fa-chart-pie"></i> Dashboard</a>
        <a class="nav-link" data-tab="sellers"><i class="fas fa-users-cog"></i> Vendedores</a>
        <a class="nav-link" data-tab="ranking"><i class="fas fa-trophy"></i> Ranking</a>
    </nav>

    <main id="main-content">
        <section id="dashboard" class="section-content is-active">
            <div class="header-bar"><h2>Dashboard</h2></div>
            <div class="kpi-grid" id="dashboard-metrics"><p>Carregando...</p></div>
        </section>

        <section id="sellers" class="section-content">
            <div class="header-bar"><h2>Gerenciar Vendedores</h2></div>
             <table>
                <thead><tr><th>Vendedor</th><th>Nível</th><th>Comissão</th><th>Status</th><th>Ações</th></tr></thead>
                <tbody id="sellers-body"></tbody>
            </table>
        </section>
        
        <section id="ranking" class="section-content">
            <div class="header-bar"><h2>Ranking de Vendedores</h2></div>
             <table>
                <thead><tr><th>#</th><th>Nome</th><th>Vendas Pagas</th><th>Faturamento Total</th></tr></thead>
                <tbody id="ranking-body"></tbody>
            </table>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const API_BASE_URL = 'https://hottrack.vercel.app'; // CONFIRME A URL DO SEU BACKEND
            let ADMIN_API_KEY = sessionStorage.getItem('ADMIN_API_KEY');

            const apiFetch = async (endpoint, options = {}) => {
                if (!ADMIN_API_KEY) {
                    ADMIN_API_KEY = prompt('Por favor, insira sua Chave de API de Administrador:');
                    if (!ADMIN_API_KEY) throw new Error('Chave de API não fornecida.');
                    sessionStorage.setItem('ADMIN_API_KEY', ADMIN_API_KEY);
                }
                const headers = { 'Content-Type': 'application/json', 'x-admin-api-key': ADMIN_API_KEY, ...options.headers };
                const response = await fetch(`${API_BASE_URL}/api/admin${endpoint}`, { ...options, headers });
                if (response.status === 403) {
                    sessionStorage.removeItem('ADMIN_API_KEY');
                    throw new Error('Acesso negado. Chave de API inválida.');
                }
                if (!response.ok) {
                    const error = await response.json().catch(() => ({ message: `Erro ${response.status} na API.` }));
                    throw new Error(error.message);
                }
                return response.json();
            };
            
            const formatCurrency = (value) => `R$ ${parseFloat(value).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
            
            const getLevel = (revenue) => {
                revenue = parseFloat(revenue);
                if (revenue < 1000) return { name: "Bronze", icon: "fa-shield-bronze", color: "#cd7f32" };
                if (revenue < 5000) return { name: "Prata", icon: "fa-shield-alt", color: "#c0c0c0" };
                if (revenue < 15000) return { name: "Ouro", icon: "fa-shield", color: "#ffd700" };
                return { name: "Platina", icon: "fa-gem", color: "#e5e4e2" };
            };

            const loadDashboard = async () => {
                try {
                    const data = await apiFetch('/dashboard');
                    document.getElementById('dashboard-metrics').innerHTML = `
                        <div class="card kpi-card"><p class="heading">Faturamento Total</p><p class="value">${formatCurrency(data.total_revenue)}</p></div>
                        <div class="card kpi-card"><p class="heading">Vendedores</p><p class="value">${data.total_sellers}</p></div>
                        <div class="card kpi-card"><p class="heading">Vendas Pagas</p><p class="value">${data.total_paid_transactions}</p></div>
                        <div class="card kpi-card"><p class="heading">Lucro do SaaS</p><p class="value">${formatCurrency(data.saas_profit)}</p></div>
                    `;
                } catch (error) { if (error.message !== 'Chave de API não fornecida.') alert('Erro ao carregar dashboard: ' + error.message); }
            };

            const loadSellers = async () => {
                try {
                    const data = await apiFetch('/sellers');
                    document.getElementById('sellers-body').innerHTML = data.map(seller => {
                        const level = getLevel(seller.total_revenue);
                        let commissionText = 'Padrão (2.99%)';
                        if (seller.commission_fixed_brl) commissionText = `R$ ${parseFloat(seller.commission_fixed_brl).toFixed(2)}`;
                        else if (seller.commission_percentage) commissionText = `${parseFloat(seller.commission_percentage).toFixed(2)}%`;
                        
                        return `
                        <tr>
                            <td><strong>${seller.name}</strong><br><small class="text-secondary">${seller.email}</small></td>
                            <td><div class="level-badge" style="color: ${level.color};"><i class="fas ${level.icon}"></i> ${level.name}</div></td>
                            <td>${commissionText}</td>
                            <td><span class="tag ${seller.is_active ? 'is-success' : 'is-danger'}">${seller.is_active ? 'Ativo' : 'Bloqueado'}</span></td>
                            <td>
                                <button title="${seller.is_active ? 'Bloquear' : 'Ativar'}" class="action-button ${seller.is_active ? 'danger' : ''}" onclick="toggleSellerActive(${seller.id}, ${!seller.is_active})"><i class="fas ${seller.is_active ? 'fa-lock' : 'fa-lock-open'}"></i></button>
                                <button title="Alterar Senha" class="action-button" onclick="changeSellerPassword(${seller.id})"><i class="fas fa-key"></i></button>
                                <button title="Definir Comissão" class="action-button" onclick="openCommissionModal(${seller.id}, '${seller.commission_percentage || ''}', '${seller.commission_fixed_brl || ''}')"><i class="fas fa-percent"></i></button>
                            </td>
                        </tr>`;
                    }).join('');
                } catch (error) { if (error.message !== 'Chave de API não fornecida.') alert('Erro ao carregar vendedores: ' + error.message); }
            };

            const loadRanking = async () => {
                try {
                    const data = await apiFetch('/ranking');
                    document.getElementById('ranking-body').innerHTML = data.map((seller, i) => `
                        <tr>
                            <th>${i + 1}</th><td>${seller.name}</td><td>${seller.email}</td>
                            <td>${seller.total_sales}</td><td>${formatCurrency(seller.total_revenue)}</td>
                        </tr>`).join('');
                } catch (error) { if (error.message !== 'Chave de API não fornecida.') alert('Erro ao carregar ranking: ' + error.message); }
            };
            
            const navLinks = document.querySelectorAll('.nav-link');
            const sections = document.querySelectorAll('.section-content');
            navLinks.forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    if(link.classList.contains('is-active')) return;
                    navLinks.forEach(item => item.classList.remove('is-active'));
                    sections.forEach(item => item.classList.remove('is-active'));
                    link.classList.add('is-active');
                    const targetSection = document.getElementById(link.dataset.tab);
                    if (targetSection) targetSection.classList.add('is-active');
                    if (link.dataset.tab === 'dashboard') loadDashboard();
                    else if (link.dataset.tab === 'sellers') loadSellers();
                    else if (link.dataset.tab === 'ranking') loadRanking();
                });
            });

            const commissionModal = document.getElementById('commission-modal');
            window.openCommissionModal = (id, percentage, fixed) => {
                commissionModal.innerHTML = `
                    <div class="modal-content">
                        <span class="close-button" onclick="closeCommissionModal()">&times;</span>
                        <h3 style="font-size: 1.5rem; margin-bottom: 1.5rem;">Definir Comissão</h3>
                        <input type="hidden" id="commission-seller-id" value="${id}">
                        <div><label for="commission-percentage" class="form-label">Comissão Percentual (%)</label><input type="number" id="commission-percentage" class="form-input" value="${percentage}" placeholder="Ex: 5.00"></div>
                        <div><label for="commission-fixed" class="form-label">Comissão Fixa (R$)</label><input type="number" id="commission-fixed" class="form-input" value="${fixed}" placeholder="Ex: 0.50"></div>
                        <p style="color: var(--text-secondary); font-size: 0.8rem; margin-top: -0.5rem; margin-bottom: 1.5rem;">Deixe ambos em branco para o padrão. Se ambos forem preenchidos, a comissão FIXA terá prioridade.</p>
                        <button class="modal-button" onclick="saveCommission()">Salvar Comissão</button>
                    </div>`;
                commissionModal.style.display = 'flex';
            };
            window.closeCommissionModal = () => commissionModal.style.display = 'none';
            window.saveCommission = async () => {
                const id = document.getElementById('commission-seller-id').value;
                const percentage = document.getElementById('commission-percentage').value;
                const fixed = document.getElementById('commission-fixed').value;
                try {
                    await apiFetch(`/sellers/${id}/commission`, { method: 'PUT', body: JSON.stringify({ percentage: percentage ? parseFloat(percentage) : null, fixed: fixed ? parseFloat(fixed) : null }) });
                    alert('Comissão atualizada!');
                    closeCommissionModal();
                    loadSellers();
                } catch (error) { alert('Erro ao salvar comissão: ' + error.message); }
            };
            window.toggleSellerActive = async (id, isActive) => {
                if (confirm(`Tem certeza que deseja ${isActive ? 'ativar' : 'bloquear'} este usuário?`)) {
                    try {
                        await apiFetch(`/sellers/${id}/toggle-active`, { method: 'POST', body: JSON.stringify({ isActive }) });
                        loadSellers();
                    } catch (error) { alert('Erro ao alterar status: ' + error.message); }
                }
            };
            window.changeSellerPassword = async (id) => {
                const newPassword = prompt('Digite a nova senha (mínimo 8 caracteres):');
                if (newPassword && newPassword.length >= 8) {
                    try {
                        await apiFetch(`/sellers/${id}/password`, { method: 'PUT', body: JSON.stringify({ newPassword }) });
                        alert('Senha alterada com sucesso!');
                    } catch (error) { alert('Erro ao alterar senha: ' + error.message); }
                } else if(newPassword) { alert('Senha inválida.'); }
            };

            loadDashboard();
        });
    </script>
</body>
</html>
